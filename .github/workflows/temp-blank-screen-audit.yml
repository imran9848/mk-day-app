name: Temporary blank-screen audit
on:
  push:
    branches:
      - fix-blank-screen-full-audit-2026-11-24
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and syntax-check inline JavaScript
        run: |
          python3 - <<'PY'
          import pathlib
          html=pathlib.Path('index.html').read_text()
          pieces=html.split('<script')
          scripts=[]
          for piece in pieces[1:]:
              head, rest=piece.split('>',1)
              if 'src=' in head.lower():
                  continue
              code=rest.split('</script>',1)[0]
              if code.strip():
                  scripts.append(code)
          pathlib.Path('/tmp/inline-scripts').mkdir(exist_ok=True)
          for i,script in enumerate(scripts):
              pathlib.Path(f'/tmp/inline-scripts/script-{i}.js').write_text(script)
          print(f'Extracted {len(scripts)} inline scripts')
          assert len(scripts)>0
          PY
          for f in /tmp/inline-scripts/*.js; do node --check "$f"; done
      - name: Check HTML tag counts
        run: |
          python3 - <<'PY'
          import re,pathlib
          h=pathlib.Path('index.html').read_text()
          checks={'html_open':len(re.findall(r'<html\b',h,re.I)),'html_close':len(re.findall(r'</html>',h,re.I)),'body_open':len(re.findall(r'<body\b',h,re.I)),'body_close':len(re.findall(r'</body>',h,re.I))}
          print(checks)
          assert all(count==1 for count in checks.values())
          PY
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: python3 -m http.server 8000 >/tmp/server.log 2>&1 &
      - name: Run browser smoke test
        run: |
          cat > smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.addInitScript(()=>{
              localStorage.setItem('mkc',JSON.stringify({userProfile:{phone:'01000000000',name:'Smoke Test'},tx:[],p:[],todo:[],bz:{},sp:{},pw:'',side:'r',u:0,lang:'bn'}));
            });
            await page.route('https://www.gstatic.com/**',route=>route.abort());
            await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1200);
            const app=await page.locator('#app').innerText();
            if(!app.trim())throw new Error('App container is blank');
            if(app.includes('অ্যাপ লোড হতে সমস্যা হয়েছে'))throw new Error('Render fallback error: '+app.slice(0,300));
            const missing=[];
            for(const selector of ['.home-notification-button','.float-community-ball','.float-home-quick-access','#float-ball']) if(await page.locator(selector).count()===0)missing.push(selector);
            if(missing.length)throw new Error('Home controls missing: '+missing.join(','));
            if(errors.length)throw new Error('Page errors: '+errors.join(' | '));
            console.log('PASS: app nonblank, Home rendered, all approved shortcuts present');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node smoke.cjs
