name: Temporary blank-screen audit
on:
  push:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and syntax-check inline JavaScript
        run: |
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', html, re.I)
          pathlib.Path('/tmp/inline-scripts').mkdir(exist_ok=True)
          for i, script in enumerate(scripts):
              pathlib.Path(f'/tmp/inline-scripts/script-{i}.js').write_text(script)
          print(f'Extracted {len(scripts)} inline script blocks')
          PY
          for f in /tmp/inline-scripts/*.js; do node --check "$f"; done
      - name: HTML structural sanity
        run: |
          python3 - <<'PY'
          import re,pathlib
          h=pathlib.Path('index.html').read_text()
          counts={'html_open':len(re.findall(r'<html\b',h,re.I)),'html_close':len(re.findall(r'</html>',h,re.I)),'body_open':len(re.findall(r'<body\b',h,re.I)),'body_close':len(re.findall(r'</body>',h,re.I))}
          print(counts)
          assert all(counts[k]==1 for k in counts)
          PY
