name: Temporary blank-screen audit
on:
  push:
    branches:
      - fix-blank-screen-full-audit-2026-11-24
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and syntax-check inline JavaScript
        run: |
          python3 - <<'PY'
          import pathlib
          html=pathlib.Path('index.html').read_text()
          pieces=html.split('<script')
          scripts=[]
          for piece in pieces[1:]:
              head, rest=piece.split('>',1)
              if 'src=' in head.lower():
                  continue
              code=rest.split('</script>',1)[0]
              if code.strip():
                  scripts.append(code)
          pathlib.Path('/tmp/inline-scripts').mkdir(exist_ok=True)
          for i,script in enumerate(scripts):
              pathlib.Path(f'/tmp/inline-scripts/script-{i}.js').write_text(script)
          print(f'Extracted {len(scripts)} inline scripts')
          assert len(scripts)>0
          PY
          for f in /tmp/inline-scripts/*.js; do node --check "$f"; done
      - name: Check HTML tag counts
        run: |
          python3 - <<'PY'
          import re,pathlib
          h=pathlib.Path('index.html').read_text()
          checks={'html_open':len(re.findall(r'<html\b',h,re.I)),'html_close':len(re.findall(r'</html>',h,re.I)),'body_open':len(re.findall(r'<body\b',h,re.I)),'body_close':len(re.findall(r'</body>',h,re.I))}
          print(checks)
          assert all(count==1 for count in checks.values())
          PY
