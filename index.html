function bizEditProduct(id){const b=ensureBiz(),p=b.products.find(x=>x.id==id);if(!p)return;const a=bizPackages(p);ask('পণ্য সম্পাদনা',[{id:'n',ph:'পণ্যের নাম',v:p.n},{id:'sku',ph:'কোড (ঐচ্ছিক)',v:p.sku||''},{id:'unit',ph:'পরিমাপ: কেজি / পিস / লিটার',v:p.unit==='একক'?'':p.unit||''},{id:'cost',ph:'ক্রয়মূল্য (প্রতি '+(p.unit&&p.unit!=='একক'?p.unit:'কেজি/পিস')+')',n:1,v:p.cost},{id:'price',ph:'বিক্রয়মূল্য (প্রতি '+(p.unit&&p.unit!=='একক'?p.unit:'কেজি/পিস')+')',n:1,v:p.price},{id:'pack',ph:'প্যাকেটের নাম (যেমন বস্তা / হালি)',v:a[0]?.name||''},{id:'factor',ph:'এক প্যাকেটে কত '+(p.unit&&p.unit!=='একক'?p.unit:'কেজি / পিস')+'? (যেমন ২৫)',n:1,v:a[0]?.factor||''},{id:'pack2',ph:'দ্বিতীয় প্যাকেটের নাম (যেমন বড় বস্তা) (ঐচ্ছিক)',v:a[1]?.name||''},{id:'factor2',ph:'দ্বিতীয় প্যাকেটে কত '+(p.unit&&p.unit!=='একক'?p.unit:'কেজি / পিস')+'? (যেমন ৫০, ঐচ্ছিক)',n:1,v:a[1]?.factor||''}],v=>{if(!v.n)return toast('পণ্যের নাম লেখো');if(+v.cost<0||+v.price<0)return toast('দাম ঋণাত্মক হতে পারে না');const packages=[];if(v.pack||v.factor){if(!v.pack||!(+v.factor>0))return toast('প্রথম প্যাকেটের নাম ও পরিমাণ দুটোই দাও');packages.push({name:v.pack.trim(),factor:+v.factor})}if(v.pack2||v.factor2){if(!v.pack2||!(+v.factor2>0))return toast('দ্বিতীয় প্যাকেটের নাম ও পরিমাণ দুটোই দাও');packages.push({name:v.pack2.trim(),factor:+v.factor2})}const name=v.n.trim().toLocaleLowerCase();if(b.products.some(x=>x.id!==id&&(x.n||'').trim().toLocaleLowerCase()===name))return toast('এই নামে অন্য পণ্য আগে থেকেই আছে।');const nextUnit=v.unit.trim()||'একক';const hasHistory=(+p.qty||0)>1e-9||b.sales.some(x=>x.pid==id)||b.purchases.some(x=>x.pid==id)||b.returns.some(x=>x.pid==id);if(hasHistory&&nextUnit!==(p.unit||'একক'))return toast('এই পণ্যের লেনদেনের ইতিহাস আছে। মূল একক পরিবর্তন করা যাবে না; এতে পুরোনো মজুত ও হিসাব ভুল হতে পারে।');const keys=packages.map(x=>x.name.trim().toLocaleLowerCase());if(new Set(keys).size!==keys.length)return toast('দুটি প্যাকেটের নাম আলাদা হতে হবে');if(packages.some(x=>!Number.isFinite(+ function bizAddCustomer(){ask('নতুন কাস্টমার',[{id:'n',ph:'কাস্টমারের নাম'},{id:'ph',ph:'মোবাইল নাম্বার',n:1},{id:'ad',ph:'ঠিকানা'}],v=>{if(!v.n)return toast('নাম লেখো');const c={id:Date.now(),n:v.n,ph:v.ph,ad:v.ad};ensureBiz().customers.push(c);ensureContacts();if(!D.contacts.some(x=>contactKey(x)===contactKey(c)))D.contacts.push({...c,source:'business'});D.vd=D.contacts;save();R()})}
function bizAskQty(kind,p,old,done){const opts=bizUnitOptions(p);let oldUnit=old?bizUnitKey(old.unitKey):'base';if(old&&old.unitName){const named=opts.find(x=>x.t.split(' (')[0]===old.unitName);if(named&&(oldUnit==='base'||!opts.some(x=>x.v===oldUnit)))oldUnit=named.v}ask('একক নির্বাচন করো',[{id:'unit',sel:oldUnit,o:opts.map(x=>({v:x.v,t:x.t}))}],u=>{const key=bizUnitKey(u),unit=opts.find(x=>x.v===key)||opts[0],oldQty=old?bizRound((+old.q||0)/unit.factor):'';ask(kind==='sale'?'বিক্রয়ের পরিমাণ ও টাকা':'ক্রয়ের পরিমাণ ও টাকা',[{id:'q',ph:'পরিমাণ ('+unit.t+')',n:1,v:oldQty},{id:'amt',ph:'মোট টাকা (৳)',n:1,v:old?old.amt:''},{id:'note',ph:'নোট (ঐচ্ছিক)',v:old?old.note||'':''}],v=>{const input=+v.q,amount=bizRound(v.amt),baseQty=bizRound(input*unit.factor);if(!(Number.isFinite(input)&&input>0&&Number.isFinite(amount)&&amount>0&&Number.isFinite(baseQty)&&baseQty>0))return toast('পরিমাণ ও টাকা সঠিকভাবে লেখো');done({q:baseQty,inputQty:input,unitKey:key,unitName:key==='base'?(p.unit||'একক'):unit.t.split(' (')[0],unitFactor:unit.factor,amt:amount,note:v.note||''})})})}
function bizSaleReturned(x){return ensureBiz().returns.filter(r=>r.kind==='sale'&&r.sourceId===x.id).reduce((a,r)=>a+(+r.amt||0),0)}function bizSalePaid(x){const b=ensureBiz();return bizRound((+x.paid||0)+b.payments.filter(p=>p.saleId===x.id).reduce((a,p)=>a+(+p.amt||0),0))}function bizSaleDue(x){return bizRound((+x.amt||0)-bizSaleReturned(x)-bizSalePaid(x))}function bizCustomerDue(id){return ensureBiz().sales.filter(x=>x.customerId==id).reduce((a,x)=>a+bizSaleDue(x),0)}
function bizCustomerHistory(id){go('bizcustomer',id)}
function bizCustomerSaveInfo(id){const b=ensureBiz(),c=b.customers.find(x=>x.id==id);if(!c)return;c.ph=($('#bizCustomerPhone')?.value||'').trim();c.ad=($('#bizCustomerAddress')?.value||'').trim();save();R();toast('কাস্টমারের তথ্য আপডেট হয়েছে')}
P.bizcustomer=function(id){const b=ensureBiz(),c=b.customers.find(x=>x.id==id);if(!c)return['কাস্টমার পাওয়া যায়নি','#185FA5','<p>এই কাস্টমারটি পাওয়া যায়নি।</p>'];const sales=b.sales.filter(x=>x.customerId==id).slice().sort((a,z)=>(z.d||0)-(a.d||0)),returns=b.returns.filter(r=>r.kind==='sale'&&sales.some(x=>x.id===r.sourceId)),payments=b.payments.filter(p=>p.customerId==id),gross=sales.reduce((a,x)=>a+(+x.amt||0),0),returned=returns.reduce((a,x)=>a+(+x.amt||0),0),initial=sales.reduce((a,x)=>a+(+x.paid||0),0),later=payments.reduce((a,x)=>a+(+x.amt||0),0),due=bizCustomerDue(id),events=[];sales.forEach(x=>events.push({d:x.d||0,type:'sale',html:'<b>বিক্রয়</b> · '+htmlEsc(x.n)+' × '+htmlEsc(bizEntryQty(x,b.products.find(p=>p.id==x.pid)))+'<br><small>মোট '+bizMoney(x.amt)+' · শুরুতে জমা '+bizMoney(x.paid||0)+' · ফেরত '+bizMoney(bizSaleReturned(x))+' · বর্তমানে বাকি '+bizMoney(Math.max(0,bizSaleDue(x)))+'</small>'}));payments.forEach(x=>events.push({d:x.d||0,type:'payment',html:'<b style="color:#1a9e4b">বাকি টাকা জমা</b> · '+bizMoney(x.amt)}));returns.forEach(x=>events.push({d:x.d||0,type:'return',html:'<b style="color:#e8590c">পণ্য ফেরত</b> · '+htmlEsc(x.n)+' · '+bizMoney(x.amt)}));events.sort((a,z)=>z.d-a.d);const dueButton=due>0?'<button class="btn" style="background:#1a9e4b;margin:12px 0;width:100%;padding:14px;font-size:16px" onclick="bizReceive('+id+')">＋ বাকি টাকা জমা নিন</button>':'';return[c.n+' — কাস্টমারের হিসাব','#185FA5',`<style>.biz-customer-page .biz-customer-card{border:1px solid #d8e0e8;border-radius:14px;padding:13px;margin:9px 0}.biz-customer-page .biz-customer-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.biz-customer-page .biz-customer-stat{background:#f2f6fa;border-radius:11px;padding:11px}.biz-customer-page .biz-customer-stat b{display:block;font-size:18px;margin-top:4px}.biz-customer-page input{margin:5px 0 9px}.biz-customer-event{padding:12px 2px;border-bottom:1px solid #e6eaf0;display:flex;gap:10px;align-items:flex-start}.biz-customer-event:last-child{border:0}</style><div class="biz-customer-page"><div class="biz-customer-card"><h3 style="margin:0 0 10px">কাস্টমারের তথ্য</h3><div class="biz-sale-label">নাম</div><div style="font-size:18px;font-weight:700;margin-bottom:10px">${htmlEsc(c.n)}</div><div class="biz-sale-label">মোবাইল নম্বর</div><input id="bizCustomerPhone" inputmode="tel" placeholder="ফোন নম্বর" value="${htmlEsc(c.ph||'')}"><div class="biz-sale-label">ঠিকানা</div><input id="bizCustomerAddress" placeholder="ঠিকানা" value="${htmlEsc(c.ad||'')}"><button class="btn" style="background:#546e7a" onclick="bizCustomerSaveInfo(${id})">তথ্য আপডেট করো</button></div><div class="biz-customer-card"><h3 style="margin:0 0 10px">লেনদেনের সারাংশ</h3><div class="biz-customer-grid"><div class="biz-customer-stat">মোট বিক্রয়<b>${bizMoney(gross)}</b></div><div class="biz-customer-stat">পণ্য ফেরত<b>${bizMoney(returned)}</b></div><div class="biz-customer-stat">শুরুতে জমা<b>${bizMoney(initial)}</b></div><div class="biz-customer-stat">পরে জমা<b>${bizMoney(later)}</b></div></div><div style="margin-top:9px;padding:13px;border-radius:11px;background:${due>0?'#fdecea':due<0?'#e3eefb':'#e8f5e9'}"><div style="font-weight:700">${due>0?'বর্তমানে কাস্টমারের বাকি':due<0?'কাস্টমারের অতিরিক্ত জমা / ক্রেডিট':'সব টাকা পরিশোধ হয়েছে'}</div><div style="font-size:25px;font-weight:800;color:${due>0?'#c62828':due<0?'#185FA5':'#1a9e4b'}">${bizMoney(Math.abs(due))}</div></div>${dueButton}</div><div class="biz-customer-card"><h3 style="margin:0 0 8px">সম্পূর্ণ লেনদেনের ইতিহাস</h3>${events.map(x=>'<div class="biz-customer-event"><span style="flex:1">'+x.html+'</span><small style="white-space:nowrap;color:#687785">'+dt(x.d)+'</small></div>').join('')||'<p style="color:#888">এখনো কোনো লেনদেন নেই।</p>'}</div><button class="btn" style="background:#777;margin:8px 0 14px" onclick="back()">কাস্টমার লিস্টে ফিরে যাও</button></div>`]}

function bizStock(kind){const b=ensureBiz(),products=b.products;if(!products.length)return toast('আগে পণ্য যোগ করো');ask(kind==='sale'?'নতুন বিক্রয় — পণ্য নির্বাচন':'নতুন ক্রয় — পণ্য নির্বাচন',[{id:'p',o:products.map(x=>({v:String(x.id),t:x.n+' · স্টক '+bizStockText(x)}))}],v=>{const p=products.find(x=>String(x.id)===v.p);if(!p)return toast('পণ্য নির্বাচন করো');bizAskQty(kind,p,null,d=>{if(kind==='sale'&&d.q>(+p.qty||0)+1e-9)return toast('স্টকে পর্যাপ্ত পণ্য নেই');const finishSale=(customerId,paid)=>{const cost=bizRound(d.q*(+p.cost||0));p.qty=bizRound((+p.qty||0)-d.q);const c=b.customers.find(x=>x.id==customerId);b.sales.push({id:Date.now(),pid:p.id,n:p.n,...d,customerId:customerId||null,customerName:c?c.n:'',paid:paid,cost,profit:bizRound(d.amt-cost),d:Date.now()});save();R();toast('বিক্রয় সেভ হয়েছে')};if(kind==='sale'){const opts=[{v:'',t:'সাধারণ বিক্রয় (কাস্টমার যুক্ত নয়)'},...b.customers.map(c=>({v:String(c.id),t:c.n+(c.ph?' · '+c.ph:'')}))];ask('কাস্টমার নির্বাচন ও টাকা গ্রহণ',[{id:'c',o:opts},{id:'paid',ph:'এখন কত টাকা পেলাম? (বাকি হলে ০)',n:1,v:String(d.amt)}],v=>{const paid=v.paid===''?0:Number(v.paid);if(!Number.isFinite(paid)||paid<0||paid>d.amt)return toast('জমা টাকার পরিমাণ সঠিক নয়');finishSale(v.c, bizRound(paid))})}else{const oldQty=+p.qty||0,oldCost=+p.cost||0,unitCost=bizRound(d.amt/d.q),totalQty=oldQty+d.q;p.cost=oldQty>0?bizRound((oldQty*oldCost+d.q*unitCost)/totalQty):unitCost;p.qty=bizRound(totalQty);b.purchases.push({id:Date.now(),pid:p.id,n:p.n,...d,d:Date.now()});save();R();toast('ক্রয় সেভ হয়েছে')}})})}function bizReceive(id){const b=ensureBiz(),c=b.customers.find(x=>x.id==id);if(!c)return;const open=b.sales.filter(x=>x.customerId==id&&bizSaleDue(x)>0).sort((a,b)=>a.d-b.d);const total=open.reduce((a,x)=>a+bizSaleDue(x),0);if(total<=0)return toast('এই কাস্টমারের কোনো বাকি নেই');ask(c.n+' — বাকি পরিশোধ',[{id:'amt',ph:'কত টাকা পরিশোধ করলেন? সর্বোচ্চ '+bizMoney(total),n:1}],v=>{const amount=Number(v.amt);if(!Number.isFinite(amount)||amount<=0||amount>total)return toast('টাকার পরিমাণ সঠিক নয়');let left=bizRound(amount);open.forEach(x=>{if(left<=0)return;const take=Math.min(left,bizSaleDue(x));if(take>0)b.payments.push({id:Date.now()+b.payments.length,customerId:id,saleId:x.id,amt:bizRound(take),d:Date.now()});left=bizRound(left-take)});save();R();toast('টাকা জমা হয়েছে; বাকি আপডেট হয়েছে')})}
function bizEditEntry(kind,id){const b=ensureBiz(),list=kind==='sale'?b.sales:b.purchases,x=list.find(y=>y.id==id);if(!x)return;if(kind==='sale'&&(x.customerId||b.payments.some(p=>p.saleId===id)))return toast('কাস্টমার বা টাকা জমার হিসাব যুক্ত আছে। নিরাপত্তার জন্য এডিট বন্ধ।');if(b.returns.some(r=>r.sourceId===id))return toast('এই লেনদেনে রিটার্ন আছে। রিটার্নের হিসাব আগে ঠিক করো।');const p=b.products.find(y=>y.id==x.pid);if(!p)return toast('এই এন্ট্রির পণ্য পাওয়া যায়নি');bizAskQty(kind,p,x,d=>{const oldQ=+x.q||0;if(kind==='sale'){const available=(+p.qty||0)+oldQ;if(d.q>available+1e-9)return toast('স্টকে পর্যাপ্ত পণ্য নেই');const unitCost=oldQ?(+x.cost||0)/oldQ:(+p.cost||0);p.qty=bizRound(available-d.q);Object.assign(x,d,{cost:bizRound(d.q*unitCost),profit:bizRound(d.amt-bizRound(d.q*unitCost))})}else{const available=(+p.qty||0)-oldQ;if(available< -1e-9)return toast('বর্তমান স্টক থেকে আগের ক্রয় ফেরত নেওয়া যাচ্ছে না');p.qty=bizRound(available+d.q);Object.assign(x,d)}x.n=p.n;save();R();toast('এন্ট্রি আপডেট হয়েছে')})}
function bizDeleteEntry(kind,id){const b=ensureBiz(),list=kind==='sale'?b.sales:b.purchases,x=list.find(y=>y.id==id);if(!x)return;if(kind==='sale'&&(x.customerId||b.payments.some(p=>p.saleId===id)))return toast('কাস্টমার বা টাকা জমার হিসাব যুক্ত আছে। নিরাপত্তার জন্য ডিলিট বন্ধ।');if(b.returns.some(r=>r.sourceId===id))return toast('এই লেনদেনে রিটার্ন আছে। আগে রিটার্নের হিসাব ঠিক করো।');yn((kind==='sale'?'এই বিক্রয়':'এই ক্রয়')+' মুছবে? স্টকও সমন্বয় হবে।',()=>{const p=b.products.find(y=>y.id==x.pid);if(kind==='purchase'&&p&&(+p.qty||0)-(+x.q||0)<-1e-9)return toast('এই ক্রয়ের মাল বিক্রি হয়ে গেছে, মোছা যাবে না');if(p){if(kind==='sale')p.qty=bizRound((+p.qty||0)+(+x.q||0));else p.qty=bizRound((+p.qty||0)-(+x.q||0))}const i=list.findIndex(y=>y.id==id);if(i>=0)list.splice(i,1);save();R()})}

function bzOk(i,j){const k=Object.keys(D.bz)[i];let x=D.bz[k][j];x=typeof x=='string'?{n:x}:x;const q=$('#q'+j).value,m=+$('#p'+j).value;if(!m)return toast('টাকা লেখো');if(x.l)x.pv={q:x.q,l:x.l,d:x.d};x.q=q;x.l=m;x.d=Date.now();D.bz[k][j]=x;D.tx.push({id:Date.now(),t:'e',c:'বাজার',s:x.n,m,n:q,cr:false,d:Date.now()});save();R()}
function kk(k){if(k=='C')ce='';else if(k=='⌫')ce=ce.slice(0,-1);else if(k=='='){try{ce=String(+Function('return '+ce.replace(/×/g,'*').replace(/÷/g,'/').replace(/%/g,'/100'))().toFixed(6))}catch(e){ce='ভুল'}}else ce+=k;R()}

let contactQ='',cashQ='';
function contactKey(p){const ph=String(p.ph||'').replace(/\D/g,'');return ph.length>4?'p:'+ph:'n:'+String(p.n||'').trim().toLocaleLowerCase()}
function ensureContacts(){
 D.contacts=Array.isArray(D.contacts)?D.contacts:[];
 const all=[...(Array.isArray(D.vd)?D.vd:[])];
 if(D.biz&&Array.isArray(D.biz.customers))all.push(...D.biz.customers);
 Object.values(D.sp||{}).forEach(a=>{if(Array.isArray(a))all.push(...a)});
 const seen=new Map(),idMap={};
 [...D.contacts,...all].forEach(p=>{if(!p||!p.n)return;const key=contactKey(p);let q=seen.get(key);if(!q){q={...p,id:p.id||Date.now()+Math.floor(Math.random()*10000)};seen.set(key,q);D.contacts.push(q)}else{if(!q.ph&&p.ph)q.ph=p.ph;if(!q.ad&&p.ad)q.ad=p.ad;if(!q.fb&&p.fb)q.fb=p.fb}if(p.id!=null)idMap[p.id]=q.id});
 D.contacts=[...seen.values()];
 (D.tx||[]).forEach(x=>{if(x.sp!=null&&idMap[x.sp]!=null)x.sp=idMap[x.sp]});
 D.vd=D.contacts;
 return D.contacts
}
function addContact(done){
 ensureContacts();
 ask('নতুন কন্টাক্ট',[{id:'n',ph:'নাম লিখুন'},{id:'ph',ph:'মোবাইল নম্বর',n:1},{id:'ad',ph:'ঠিকানা (ঐচ্ছিক)'},{id:'note',ph:'নোট (ঐচ্ছিক)'}],v=>{
  if(!v.n)return toast('নাম লিখুন');
  const probe={n:v.n,ph:v.ph},key=contactKey(probe),old=D.contacts.find(x=>contactKey(x)===key);
  if(old){if(!old.ph&&v.ph)old.ph=v.ph;if(!old.ad&&v.ad)old.ad=v.ad;save();if(done)done(old);else{R();toast('এই কন্টাক্ট আগে থেকেই আছে')}return}
  const p={id:Date.now(),n:v.n,ph:v.ph,ad:v.ad,note:v.note||'',source:'manual'};
  D.contacts.push(p);D.vd=D.contacts;save();if(done)done(p);else R()
 })
}
async function importPhoneContacts(){
 if(!navigator.contacts||!navigator.contacts.select)return toast('এই ব্রাউজারে ফোন কন্টাক্ট ইমপোর্ট সুবিধা নেই। নতুন কন্টাক্ট যোগ করে সেভ করতে পারো।');
 try{const rows=await navigator.contacts.select(['name','tel'],{multiple:true});ensureContacts();let count=0;rows.forEach(x=>{const n=(x.name||[])[0]||'',ph=(x.tel||[])[0]||'';if(!n)return;const p={n,ph},key=contactKey(p);if(!D.contacts.some(c=>contactKey(c)===key)){D.contacts.push({id:Date.now()+count++,n,ph,source:'phone'})}});D.vd=D.contacts;save();R();toast(count+'টি নতুন কন্টাক্ট যোগ হয়েছে')}catch(e){if(e&&e.name!=='AbortError')toast('কন্টাক্ট আনা যায়নি')}
}
function contactRows(q){
 const z=(q||'').trim().toLocaleLowerCase(),L=ensureContacts().filter(p=>!z||(p.n+' '+(p.ph||'')).toLocaleLowerCase().includes(z));
 return L.map((p,i)=>'<div class="row" onclick="go(\'contact\','+p.id+')"><span style="display:flex;align-items:center;gap:10px;min-width:0"><span style="width:40px;height:40px;border-radius:50%;background:'+CL[i%8]+'22;color:'+CL[i%8]+';display:flex;align-items:center;justify-content:center;font-weight:800">'+htmlEsc((p.n||'?')[0])+'</span><span><b>'+htmlEsc(p.n)+'</b><br><small>'+htmlEsc(p.ph||'নম্বর নেই')+'</small></span></span><span>›</span></div>').join('')||'<p style="padding:14px;color:#777">কোনো কন্টাক্ট পাওয়া যায়নি।</p>'
}
function bizPickContact(id){const p=ensureContacts().find(x=>x.id==id);if(!p)return;const b=ensureBiz(),key=contactKey(p);let c=b.customers.find(x=>contactKey(x)===key);if(!c){c={id:Date.now(),n:p.n,ph:p.ph||'',ad:p.ad||''};b.customers.push(c)}bizSaleDraft.customerId=String(c.id);bizSaleDraft.customerPhone=c.ph||'';bizSaleDraft.addCustomer=false;save();R()}function bizContactOptions(){const q=(bizCustomerQ||'').toLocaleLowerCase(),L=ensureContacts().filter(x=>!q||((x.n||'')+' '+(x.ph||'')).toLocaleLowerCase().includes(q));return '<div class="row" onclick="bizSaleDraft.customerId=\'\';bizSaleCustomerChanged()"><b>সাধারণ বিক্রয় (কাস্টমার নয়)</b></div>'+L.map(x=>`<div class="row" onclick="bizPickContact(${x.id})"><span><b>${htmlEsc(x.n)}</b><br><small>${htmlEsc(x.ph||'')}</small></span><span>›</span></div>`).join('')||'<small>কন্টাক্ট নেই। নতুন কন্টাক্ট যোগ করুন।</small>'}let bizCustomerQ='';
P.bizsale=(function(old){return function(){const r=old();const oldSelect='<select onchange="bizSaleDraft.customerId=this.value;bizSaleCustomerChanged()"><option value="">সাধারণ বিক্রয় (কাস্টমার নয়)</option>';const at=r[2].indexOf(oldSelect);if(at<0)return r;const end=r[2].indexOf('</select>',at)+9;const field='<input placeholder="🔍 কাস্টমারের নাম বা নম্বর খুঁজুন" value="'+htmlEsc(bizCustomerQ)+'" oninput="bizCustomerQ=this.value;document.getElementById(\'bizCustomerOptions\').innerHTML=bizContactOptions()"><div id="bizCustomerOptions">'+bizContactOptions()+'</div><button class="btn" style="background:#1a9e4b" onclick="bizSaleDraft.customerId=\'__new__\';bizSaleCustomerChanged()">＋ নতুন কাস্টমার</button>';r[2]=r[2].slice(0,at)+field+r[2].slice(end);return r}})(P.bizsale);
P.contacts=function(){ensureContacts();return['কন্টাক্ট খাতা','#185FA5',`<input id="contactSearch" placeholder="🔍 নাম বা মোবাইল নম্বর লিখুন" value="${htmlEsc(contactQ)}" oninput="contactQ=this.value;document.getElementById('contactRows').innerHTML=contactRows(contactQ)"><div style="display:flex;gap:7px;margin:8px 0"><button class="btn" style="background:#1a9e4b" onclick="addContact()">＋ নতুন কন্টাক্ট</button><button class="btn" style="background:#185FA5" onclick="importPhoneContacts()">📥 ফোন থেকে আনুন</button></div><div id="contactRows">${contactRows(contactQ)}</div>`]}
P.contact=function(id){const p=ensureContacts().find(x=>x.id==id);if(!p)return['কন্টাক্ট পাওয়া যায়নি','#185FA5','<p>এই কন্টাক্টটি পাওয়া যায়নি।</p>'];const T=(D.tx||[]).filter(x=>x.sp==id).sort((a,b)=>b.d-a.d),inc=T.filter(x=>x.t==='i').reduce((a,x)=>a+x.m,0),exp=T.filter(x=>x.t==='e').reduce((a,x)=>a+x.m,0),rec=T.filter(x=>x.t==='i'&&x.cr).reduce((a,x)=>a+x.m-(x.pd||0),0),pay=T.filter(x=>x.t==='e'&&x.cr).reduce((a,x)=>a+x.m-(x.pd||0),0);return[p.n,'#185FA5',`<div class="debt-person-name">${htmlEsc(p.n)}</div><p style="margin:8px 0;line-height:1.7">📞 ${htmlEsc(p.ph||'নম্বর নেই')}<br>📍 ${htmlEsc(p.ad||'')}</p><div class="g3"><div class="k" style="background:#1a9e4b">মোট আয়<b>${tk(inc)}</b></div><div class="k" style="background:#d93025">মোট ব্যয়<b>${tk(exp)}</b></div><div class="k" style="background:#546e7a">নিট<b>${tk(inc-exp)}</b></div></div><div class="g3"><div class="k" style="background:#0f8a9d">পাবো<b>${tk(rec)}</b></div><div class="k" style="background:#8e24aa">দেবো<b>${tk(pay)}</b></div><div class="k" style="background:#546e7a">লেনদেন<b>${bn(T.length)}</b></div></div><div style="display:flex;gap:7px;margin:10px 0"><button class="btn" style="background:#1a9e4b" onclick="selP=${id};go('cat','i')">＋ আয়</button><button class="btn" style="background:#d93025" onclick="selP=${id};go('cat','e')">＋ ব্যয়</button></div><h4 style="margin:12px 0 5px">লেনদেনের ইতিহাস</h4>${T.map(hrow).join('')||'<p style="color:#777">এখনো কোনো লেনদেন নেই।</p>'}<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="background:#185FA5" onclick="editVd(${id})">✏️ সম্পাদনা</button><button class="btn" style="background:#777" onclick="back()">ফিরে যাও</button></div>`]}
P.cashbox=function(){const L=(D.tx||[]).filter(x=>!x.sp).sort((a,b)=>b.d-a.d),q=(cashQ||'').toLocaleLowerCase(),A=L.filter(x=>!q||((x.c||'')+' '+(x.s||'')+' '+(x.n||'')).toLocaleLowerCase().includes(q));return['ক্যাশবক্স','#0f8a9d',`<input placeholder="🔍 খরচ বা আয়ের নাম খুঁজুন" value="${htmlEsc(cashQ)}" oninput="cashQ=this.value;R()"><div class="g3"><div class="k" style="background:#1a9e4b">নগদ আয়<b>${tk(L.filter(x=>x.t==='i').reduce((a,x)=>a+x.m,0))}</b></div><div class="k" style="background:#d93025">নগদ ব্যয়<b>${tk(L.filter(x=>x.t==='e').reduce((a,x)=>a+x.m,0))}</b></div><div class="k" style="background:#546e7a">লেনদেন<b>${bn(L.length)}</b></div></div><p style="margin:8px 0;color:#667">ব্যক্তি নির্বাচন না করা আয়-ব্যয়ের হিসাব এখানে দেখা যাবে।</p>${A.map(hrow).join('')||'<p>কোনো হিসাব নেই।</p>'}`]}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
R();initFb();
</script></body></html>
