function bizStock(kind){const b=ensureBiz(),products=b.products;if(!products.length)return toast('আগে পণ্য যোগ করো');ask(kind==='sale'?'নতুন বিক্রয় — পণ্য নির্বাচন':'নতুন ক্রয় — পণ্য নির্বাচন',[{id:'p',o:products.map(x=>({v:String(x.id),t:x.n+' · স্টক '+bizStockText(x)}))}],v=>{const p=products.find(x=>String(x.id)===v.p);if(!p)return toast('পণ্য নির্বাচন করো');bizAskQty(kind,p,null,d=>{if(kind==='sale'&&d.q>(+p.qty||0)+1e-9)return toast('স্টকে পর্যাপ্ত পণ্য নেই');if(kind==='sale'){const cost=bizRound(d.q*(+p.cost||0));p.qty=bizRound((+p.qty||0)-d.q);b.sales.push({id:Date.now(),pid:p.id,n:p.n,...d,cost,profit:bizRound(d.amt-cost),d:Date.now()})}else{const oldQty=+p.qty||0,oldCost=+p.cost||0,unitCost=bizRound(d.amt/d.q),totalQty=oldQty+d.q;p.cost=oldQty>0?bizRound((oldQty*oldCost+d.q*unitCost)/totalQty):unitCost;p.qty=bizRound(totalQty);b.purchases.push({id:Date.now(),pid:p.id,n:p.n,...d,d:Date.now()})}save();R();toast(kind==='sale'?'বিক্রয় সেভ হয়েছে':'ক্রয় সেভ হয়েছে')})})}
function bizEditEntry(kind,id){const b=ensureBiz(),list=kind==='sale'?b.sales:b.purchases,x=list.find(y=>y.id==id);if(!x)return;const p=b.products.find(y=>y.id==x.pid);if(!p)return toast('এই এন্ট্রির পণ্য পাওয়া যায়নি');bizAskQty(kind,p,x,d=>{const oldQ=+x.q||0;if(kind==='sale'){const available=(+p.qty||0)+oldQ;if(d.q>available+1e-9)return toast('স্টকে পর্যাপ্ত পণ্য নেই');const unitCost=oldQ?(+x.cost||0)/oldQ:(+p.cost||0);p.qty=bizRound(available-d.q);Object.assign(x,d,{cost:bizRound(d.q*unitCost),profit:bizRound(d.amt-bizRound(d.q*unitCost))})}else{const available=(+p.qty||0)-oldQ;if(available< -1e-9)return toast('বর্তমান স্টক থেকে আগের ক্রয় ফেরত নেওয়া যাচ্ছে না');p.qty=bizRound(available+d.q);Object.assign(x,d)}x.n=p.n;save();R();toast('এন্ট্রি আপডেট হয়েছে')})}
function bizDeleteEntry(kind,id){const b=ensureBiz(),list=kind==='sale'?b.sales:b.purchases,x=list.find(y=>y.id==id);if(!x)return;yn((kind==='sale'?'এই বিক্রয়':'এই ক্রয়')+' মুছবে? স্টকও সমন্বয় হবে।',()=>{const p=b.products.find(y=>y.id==x.pid);if(kind==='purchase'&&p&&(+p.qty||0)-(+x.q||0)<-1e-9)return toast('এই ক্রয়ের মাল বিক্রি হয়ে গেছে, মোছা যাবে না');if(p){if(kind==='sale')p.qty=bizRound((+p.qty||0)+(+x.q||0));else p.qty=bizRound((+p.qty||0)-(+x.q||0))}const i=list.findIndex(y=>y.id==id);if(i>=0)list.splice(i,1);save();R()})}
