if(a==='bzt'){syncBz();const r=BZ.find(r=>r.id==v);r.on=r.on?0:1;return sheetBz()}
if(a==='bzok'){syncBz();const on=BZ.filter(r=>r.on);if(!on.length)return toast('কিছু টিক দাও');let tot=0;const nm=[];on.forEach(r=>{const b=S.bz.find(b=>b.id==r.id);b.d=today;b.p=r.p;tot+=r.p;nm.push(b.n)});SH.a=tot;SH.n=nm.join(', ');SH.cat=(cats('exp').find(c=>c.n.includes('বাজার'))||cats('exp')[0]).id;BZ=null;save();return sheet()}}

document.addEventListener('click',e=>{const t=e.target.closest('[data-pi],[data-pc],[data-a],[data-go],[data-add],[data-m],[data-c],[data-new],[data-edit],[data-settle],[data-addcat],[data-del],[data-open],[data-open2],[data-newcat],[data-mi],[data-out],#sv,#mn,#lg,.ov');if(!t)return;
  const D=t.dataset;
  if(t.id==='mn')return drawer();
  if(t.id==='lg')return login();
  if('a'in D)return act(D.a);
  if(t.classList.contains('ov')){if(e.target===t)t.classList.remove('on');return}
  if('go'in D){$('#sh').classList.remove('on');return go(D.go)}
  if('add'in D)return openAdd(D.add);
  if('m'in D){keep();SH.m=D.m;return sheet()}
  if('c'in D){keep();SH.cat=D.c;return sheet()}
  if('new'in D||'newcat'in D){const k=D.newcat||SH.k,fs=D.newcat===undefined;if(fs)keep();PK={k,n:'',e:ICONS[0],c:COLS[0],sh:fs};return pick()}
  if('pi'in D){PK.n=$('#pn').value;PK.e=ICONS[+D.pi];return pick()}
  if('pc'in D){PK.n=$('#pn').value;PK.c=COLS[+D.pc];return pick()}
  if(t.id==='sv'){keep();const a=parseFloat(SH.a);if(!(a>0))return toast('টাকার অঙ্ক লেখো');S.tx.push({id:Date.now(),k:SH.k,c:SH.cat,a,n:(SH.n||'').trim(),m:SH.m,d:today});save();$('#sh').classList.remove('on');render();return toast('সেভ হয়েছে')}
  if('edit'in D){const c=cat(V.k,V.id),n=prompt('নাম',c.pn||''),a=n!==null&&prompt('ঠিকানা',c.pa||''),ph=a!==false&&a!==null&&prompt('ফোন নম্বর',c.pp||'');if(ph===null||ph===false||a===null)return;Object.assign(c,{pn:n,pa:a,pp:ph});save();return render()}
  if('settle'in D){const ex=V.k==='exp',a=parseFloat(prompt(ex?'কত টাকা পরিশোধ করলে?':'কত টাকা ফেরত পেলে?'));if(!(a>0))return;const b=bal(V.k,V.id);if(a>b&&!confirm('বাকির চেয়ে বেশি লিখলে। তবুও সেভ করবে?'))return;S.tx.push({id:Date.now(),k:V.k,c:V.id,a,n:'',m:ex?'pay':'ret',d:today});save();return render()}
  if('addcat'in D)return openAdd(V.k,V.id);
  if('del'in D){if(confirm('এই লেনদেন মুছে ফেলবে?')){S.tx=S.tx.filter(x=>x.id!=D.del);save();render()}return}
  if('open'in D)return go('cat',{k:V.k,id:D.open});
  if('open2'in D){const[k,id]=D.open2.split('|');$('#dr').classList.remove('on');return go('cat',{k,id})}
  if('mi'in D){$('#dr').classList.remove('on');if(!D.mi)return toast('এই পেজ পরের ধাপে আসছে');const[a,b]=D.mi.split('|');return a==='hist'?go('hist',{k:b}):a==='pg'?go(b):go('cats')}
  if('out'in D){$('#dr').classList.remove('on');if(user&&firebase.auth)firebase.auth().signOut();else toast('লগইন করা নেই')}
});

function login(){if(user)return toast(user.displayName+' · লগইন করা আছে');if(!FB.apiKey)return toast('firebaseConfig বসাওনি');(()=>{const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});return firebase.auth().signInWithPopup(pr)})().catch(e=>{toast('লগইন হয়নি: '+(e.code||e.message));alert('লগইন ত্রুটি: '+(e.code||e.message))})}
try{if(FB.apiKey){firebase.initializeApp(FB);db=firebase.firestore();firebase.auth().onAuthStateChanged(async u=>{user=u;$('#lg').textContent=u?u.displayName.split(' ')[0]:'লগইন';$('#em').textContent=u?u.email:'';if(u){try{const d=await db.collection('users').doc(u.uid).get();if(d.exists){S=JSON.parse(d.data().data);norm()}else save();localStorage.mkd=JSON.stringify(S)}catch(e){}}render()})}}catch(e){}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();

})();
</script>
</body>
</html>
