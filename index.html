pl(k){const L=D.p.filter(p=>p.k==k&&!p.f),c=k=='L'?'#1B5E20':'#B71C1C',S2=ty=>L.filter(p=>p.ty==ty).reduce((s,p)=>s+bal(p),0);return[k=='L'?'ধার/বাকি · আমি পাবো':'ধার/লোন · আমি দিবো',c,`<div class="g3">${[['ব্যক্তি',S2('ব্যক্তি')],['প্রতিষ্ঠান',S2('প্রতিষ্ঠান')],[k=='L'?'মোট পাবো':'মোট দিবো',S2('ব্যক্তি')+S2('প্রতিষ্ঠান')]].map(([l,v])=>`<div class="k" style="background:${c}">${l}<b>${tk(v)}</b></div>`).join('')}</div><div class="add" onclick="addP('${k}')">+ ব্যক্তি/প্রতিষ্ঠান যোগ করো</div>`+L.sort((a,b)=>k=='L'?bal(b)-bal(a):bal(a)-bal(b)).map(p=>`<div class="row" onclick="go('pp',${p.id})"><span>${p.n}<br><small>${p.ph||''} ${p.ad||''}</small></span><b>${tk(bal(p))}</b></div>`).join('')]},
pp(id){const p=D.p.find(x=>x.id==id),c=p.k=='L'?'#1B5E20':'#B71C1C',a=p.k=='L'?'ধার দিলাম':'ধার নিলাম',r=p.k=='L'?'ফেরত পেলাম':'পরিশোধ';return[p.n+` <span onclick="frz(${id})">🔒</span> <span onclick="delP(${id})">🗑</span>`,c,`<small>${p.ph||''} · ${p.ad||''}</small><div class="k" style="background:${c};font-size:13px;margin:8px 0">এখনো বাকি<b style="font-size:20px">${tk(bal(p))}</b></div><div style="display:flex;gap:8px"><button class="btn" style="background:${c}" onclick="trn(${id},'a')">+ লেনদেন</button><button class="btn" style="background:#555" onclick="trn(${id},'p')">${r}</button></div>`+p.t.slice().reverse().map(x=>`<div class="row"><span>${x.k=='a'?a:r}<br><small>${dt(x.d)} · ${x.n||''}</small></span><b>${tk(x.m)}</b></div>`).join('')]},
lk(){const R1=D.p.filter(p=>p.f);return['হিসাব লকার 🔒','#0f8a9d',`<div style="background:#e3eefb;border-radius:8px;padding:8px;margin-bottom:8px">🔒 হিসাব ফ্রিজের ভিতরে আছে</div>`+(R1.map(p=>`<div class="row"><span>${p.n} (${p.k=='L'?'পাবো':'দিবো'})<br><b>${tk(bal(p))}</b></span><button onclick="unf(${p.id})">🔓 বের করো</button></div>`).join('')||'<p>লকার খালি</p>')]},
td(){const L=D.todo.map((x,i)=>[x,i]).filter(([x])=>!!x.dn==!!tab);return['এখন মনে থাকবে','#e8590c',`<div style="display:flex"><div class="tab ${tab?'':'on'}" onclick="tab=0;R()">করা হয়নি</div><div class="tab ${tab?'on':''}" onclick="tab=1;R()">হয়ে গেছে</div></div>`+L.map(([x,i])=>`<div class="row"><span onclick="tg(${i})">${x.dn?'✅':'⬜'} ${x.x}</span><span onclick="D.todo.splice(${i},1);save();R()">✕</span></div>`).join('')+`<button class="fab" onclick="addT()">+</button>`]},
bz(){return['মাসিক বাজার লিস্ট','#8e24aa',`<div class="gr">${Object.keys(D.bz).map((k,i)=>`<div class="mc" onclick="go('bi',${i})">${k}</div>`).join('')}</div><div class="add" onclick="ask('নতুন ক্যাটাগরি',[{id:'a',ph:'নাম'}],v=>{if(v.a){D.bz[v.a]=[];save();R()}})">+ নতুন ক্যাটাগরি</div>`]},
bi(i){const k=Object.keys(D.bz)[i];return[k,'#8e24aa',D.bz[k].map((x,j)=>{x=typeof x=='string'?{n:x}:x;return`<div class="row" style="flex-wrap:wrap"><span style="flex:1"><b>${x.n}</b><br><small>${x.l?'আগে: '+dt(x.d)+' · '+x.q+' · '+tk(x.l):''}</small></span><input id="q${j}" placeholder="পরিমাণ" style="width:70px"><input id="p${j}" inputmode="numeric" placeholder="টাকা" style="width:70px"><span onclick="bzOk(${i},${j})">✔</span> <span onclick="D.bz['${k}'].splice(${j},1);save();R()">✕</span></div>`}).join('')+`<div class="add" onclick="ask('নতুন জিনিস',[{id:'a',ph:'নাম'}],v=>{if(v.a){D.bz['${k}'].push(v.a);save();R()}})">+ নতুন জিনিস</div>`]},
calc(){const K=['C','⌫','%','÷','7','8','9','×','4','5','6','-','1','2','3','+','0','.','='];return['ক্যালকুলেটর','#5f6b7a',`<div class="kb" style="text-align:right;font-size:26px;margin-bottom:8px;min-height:56px">${ce||'0'}</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${K.map(k=>`<button class="kb" onclick="kk('${k}')">${k}</button>`).join('')}</div>`]},
set(){return['সেটিং','#185FA5',`<p>নেভিগেশন বাটন (হোম ও ব্যাক)</p><div style="display:flex;gap:8px;margin:8px 0"><button class="btn" style="background:${D.side=='l'?'#185FA5':'#999'}" onclick="D.side='l';save();R()">বাঁয়ে</button><button class="btn" style="background:${D.side=='r'?'#185FA5':'#999'}" onclick="D.side='r';save();R()">ডানে</button></div><button class="btn" style="background:#0f8a9d" onclick="ask('নতুন লকার পাসওয়ার্ড',[{id:'a',ph:'পাসওয়ার্ড'}],v=>{if(v.a){D.pw=v.a;save()}})">লকার পাসওয়ার্ড বদলাও</button>`]},
ab(){return['About Me','#7b3fe4',`<h3 style="text-align:center;color:#185FA5">কৃতজ্ঞতা প্রকাশ</h3><p style="line-height:1.7;margin:6px 0 12px">সর্বশক্তিমান মহান আল্লাহ তাআলার অশেষ রহমত এবং বাবা-মায়ের দোয়া ও আশীর্বাদে এই পথচলা। সৃষ্টির প্রতিও কৃতজ্ঞতা।</p><h3 style="text-align:center;color:#185FA5">🌟 সামাজিক দায়বদ্ধতা ও মূল্যবোধ</h3><p style="line-height:1.7;margin:6px 0 12px">সবসময় ভালো কাজ করা এবং অন্যায়ের প্রতিবাদ করা, চুপ না থাকা। এর ফল হয়তো আমরা এখন পুরোটা দেখব না, কিন্তু এটাই আমাদের সন্তান ও আগামী প্রজন্মের জন্য একটি সুন্দর, নিরাপদ ও ন্যায়ভিত্তিক সমাজ গড়ে।</p><h3 style="text-align:center;color:#185FA5">আমাদের লক্ষ্য</h3><p style="line-height:1.7;margin:6px 0 12px">ডিশ ও ক্যাবল/ইন্টারনেট ব্যবসায়ী, মুদি দোকানদার, ছোট উদ্যোক্তা ও ক্ষুদ্রঋণ ব্যবসায়ী।</p><p>যোগাযোগ: mkelitsolution@gmail.com<br>টেলিগ্রাম: t.me/MKcashmanager</p>`]}};
function cd([l,f,g],i){return`<div class="k ${i}" onclick="${g?`go(${g.map(x=>typeof x=='string'?`'${x}'`:x).join(',')})`:''}">${l}<b>${tk(f())}</b></div>`}
function R(){const[n,...a]=S.at(-1),r=P[n](...a),A=$('#app');A.innerHTML=n=='home'?r[2]:hdr(r[0],r[1])+`<div class="bd">${r[2]}</div>`+bar();clock()}
function clock(){const d=new Date();if($('#dt')){$('#dt').textContent='আজ '+d.toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long'});$('#tm').textContent=d.toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit',hour12:true})}}
setInterval(clock,20000);
function svTx(t,c,s){const m=+$('#am').value;if(!m)return toast('টাকার পরিমাণ লেখো');D.tx.push({id:Date.now(),t,c,s,m,n:$('#nt').value,cr:$('#cr').checked,d:Date.now()});save();S=[['home']];R()}
function delTx(id){if(confirm('মুছবে?')){D.tx=D.tx.filter(x=>x.id!=id);save();R()}}
function addP(k){ask('নতুন যোগ',[{id:'ty',o:['ব্যক্তি','প্রতিষ্ঠান']},{id:'n',ph:'নাম'},{id:'ph',ph:'ফোন'},{id:'ad',ph:'ঠিকানা'}],v=>{if(v.n){D.p.push({id:Date.now(),k,ty:v.ty,n:v.n,ph:v.ph,ad:v.ad,t:[]});save();R()}})}
function trn(id,k){ask(k=='a'?'লেনদেন':'পরিশোধ',[{id:'m',ph:'টাকা',n:1},{id:'n',ph:'নোট'}],v=>{if(+v.m){D.p.find(p=>p.id==id).t.push({k,m:+v.m,n:v.n,d:Date.now()});save();R()}})}
function delP(id){if(confirm('পুরো হিসাব মুছবে?')){D.p=D.p.filter(p=>p.id!=id);save();back()}}
function frz(id){pw(()=>{D.p.find(p=>p.id==id).f=1;save();back()})}
function unf(id){pw(()=>{D.p.find(p=>p.id==id).f=0;save();R()})}
function tg(i){D.todo[i].dn=!D.todo[i].dn;save();R()}
function addT(){ask('নতুন কাজ',[{id:'a',ph:'কী মনে রাখবে'}],v=>{if(v.a){D.todo.push({x:v.a});save();R()}})}
function bzOk(i,j){const k=Object.keys(D.bz)[i];let x=D.bz[k][j];x=typeof x=='string'?{n:x}:x;const q=$('#q'+j).value,m=+$('#p'+j).value;if(!m)return toast('টাকা লেখো');x.q=q;x.l=m;x.d=Date.now();D.bz[k][j]=x;D.tx.push({id:Date.now(),t:'e',c:'বাজার',s:x.n,m,n:q,cr:false,d:Date.now()});save();R()}
function kk(k){if(k=='C')ce='';else if(k=='⌫')ce=ce.slice(0,-1);else if(k=='='){try{ce=String(+Function('return '+ce.replace(/×/g,'*').replace(/÷/g,'/').replace(/%/g,'/100'))().toFixed(6))}catch(e){ce='ভুল'}}else ce+=k;R()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
R();initFb();
</script></body></html>
