var __jcLast=0;

function bizJIn(x,p){return !!(x&&x.jc&&p.base&&x.jc>=p.base.at)}
function bizJRun(base,L){
 const ev=[];
 L.purchases.forEach(x=>ev.push({k:'P',x}));L.sales.forEach(x=>ev.push({k:'S',x}));
 L.returns.forEach(x=>ev.push({k:x.kind==='sale'?'RS':'RP',x}));
 ev.sort((a,b)=>((+a.x.d||0)-(+b.x.d||0))||((+a.x.jc||0)-(+b.x.jc||0))||((+a.x.id||0)-(+b.x.id||0)));

function bizStock(kind){const b=ensureBiz(),products=b.products;if(!products.length)return toast('আগে পণ্য যোগ করো');ask(kind==='sale'?'নতুন বিক্রয় — পণ্য নির্বাচন':'নতুন ক্রয় — পণ্য নির্বাচন',[{id:'p',o:products.map(x=>({v:String(x.id),t:x.n+' · স্টক '+bizStockText(x)}))}],v=>{const p=products.find(x=>String(x.id)===v.p);if(!p)return toast('পণ্য নির্বাচন করো');bizAskQty(kind,p,null,d=>{if(kind==='sale'&&d.q>(+p.qty||0)+1e-9)return toast('স্টকে পর্যাপ্ত পণ্য নেই');const finishSale=(customerId,paid)=>{const cost=bizRound(d.q*(+p.cost||0));const c=b.customers.find(x=>x.id==customerId);const __r=bizJAdd(b,p,'sales',{id:Date.now(),pid:p.id,n:p.n,...d,customerId:customerId||null,customerName:c?c.n:'',paid:paid,cost,profit:bizRound(d.amt-cost),d:Date.now()});if(!__r.ok)return toast(bizJMsg(__r,p,'এই বিক্রয় করলে'));bizMirror('sale',b.sales[b.sales.length-1]);save();R();toast('বিক্রয় সেভ হয়েছে')};if(kind==='sale'){const opts=[{v:'',t:'সাধারণ বিক্রয় (কাস্টমার যুক্ত নয়)'},...b.customers.map(c=>({v:String(c.id),t:c.n+(c.ph?' · '+c.ph:'')}))];ask('কাস্টমার নির্বাচন ও টাকা গ্রহণ',[{id:'c',o:opts},{id:'paid',ph:'এখন কত টাকা পেলাম? (বাকি হলে ০)',n:1,v:String(d.amt)}],v=>{const paid=v.paid===''?0:Number(v.paid);if(!Number.isFinite(paid)||paid<0||paid>d.amt)return toast('জমা টাকার পরিমাণ সঠিক নয়');finishSale(v.c, bizRound(paid))})}else{bizJAdd(b,p,'purchases',{id:Date.now(),pid:p.id,n:p.n,...d,d:Date.now()});bizMirror('purchase',b.purchases[b.purchases.length-1]);save();R();toast('ক্রয় সেভ হয়েছে')}})})}function bizReceive(id){const b=ensureBiz(),c=b.customers.find(x=>x.id==id);if(!c)return;const open=b.sales.filter(x=>x.customerId==id&&bizSaleDue(x)>0).sort((a,b)=>a.d-b.d);const total=open.reduce((a,x)=>a+bizSaleDue(x),0);if(total<=0)return toast('এই কাস্টমারের কোনো বাকি নেই');ask(c.n+' — বাকি পরিশোধ',[{id:'amt',ph:'কত টাকা পরিশোধ করলেন? সর্বোচ্চ '+bizMoney(total),n:1}],v=>{const amount=Number(v.amt);if(!Number.isFinite(amount)||amount<=0||amount>total)return toast('টাকার async function importPhoneContacts(){

  });

  }else if(document.getElementById('txn-sheet')){pendR=true}
  else{R()}
  if(added)toast(added+'টি নতুন কন্টাক্ট যোগ হয়েছে'+(updated?' · '+updated+'টি নম্বর আপডেট হয়েছে':''));

 }catch(e){
  if(e&&e.name!=='AbortError')toast('ফোনের Contacts তালিকা খোলা যায়নি। এই ব্রাউজার বা WebView ফোনবুক বাছাই সমর্থন নাও করতে পারে।');
 }
}
