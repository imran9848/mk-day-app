<!DOCTYPE html>

<style>
:root{--bg:#e8f7f2;--card:#fff;--tx:#1b2a3a;--mu:#5b6b7b;--ln:#e6dfd0;--bl:#2563eb;--rd:#ef4444;--gr:#16a34a;--or:#ea580c}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;padding-bottom:70px}
button{font:inherit;border:0;cursor:pointer;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bl);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;justify-content:space-between}
header b{font-size:15px;font-weight:600}
.hr{display:flex;align-items:center;gap:10px}
.lg{background:#fff;color:var(--bl);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600}
.mn{background:none;color:#fff;font-size:26px;line-height:1}
.pg{padding:12px}
h2{font-size:16px;font-weight:600;margin-bottom:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.k{background:var(--card);border-radius:10px;padding:8px}

.box{background:var(--card);border-radius:12px;padding:10px;margin-top:10px}

.sm{font-size:11px;color:var(--mu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:.5px solid #d5dde6;display:flex;justify-content:space-around;align-items:center;padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:6}

.n-in{background:#dcfce7;color:#14532d}.n-ho{background:var(--bl);color:#fff}.n-ex{background:#fee2e2;color:#7f1d1d}
.q{border-top:.5px solid #e2e8f0;padding:7px 0;line-height:1.5;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}
.ov.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#f6f2ea;border-radius:20px 20px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
.big{width:100%;border:2px solid var(--rd);border-radius:16px;padding:10px 14px;font:600 26px inherit;background:#fff}
.big.in{border-color:var(--gr)}
.inp{width:100%;border:.5px solid #d9d2c3;border-radius:14px;padding:10px 14px;font:inherit;background:#fff;margin-top:8px}
.chips{display:flex;gap:6px;margin-top:10px}
.chips button{flex:1;padding:8px 0;border-radius:99px;background:#fff;border:.5px solid #d9d2c3;font-weight:600}
.chips .on{background:#ffedd5;border:1.5px solid var(--or);color:#7c2d12}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px;text-align:center;font-size:11px;margin-top:8px}
.cg div{cursor:pointer}
.ic{width:44px;height:44px;border-radius:14px;margin:0 auto 3px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.sel .ic{box-shadow:0 0 0 3px #f6f2ea,0 0 0 5px #16a34a}
.save{width:100%;margin-top:14px;padding:12px;border-radius:16px;color:#fff;font-size:15px;font-weight:600;background:var(--rd)}
.save.in{background:var(--gr)}
.dr{position:absolute;top:0;bottom:0;left:0;width:78%;max-width:320px;background:#f6f2ea;overflow:auto;display:flex;flex-direction:column}
.dh{background:var(--bl);color:#fff;padding:18px 14px;display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--bl);display:flex;align-items:center;justify-content:center;font-weight:700}
.mi{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;margin:5px 8px 0;padding:11px 12px;font-weight:600;width:calc(100% - 16px);text-align:left}
.ft{margin-top:auto;text-align:center;font-size:12px;color:var(--mu);padding:12px;border-top:.5px solid #d9d2c3}
.back{background:none;font-size:22px;margin-right:6px}
.id{background:#fff;border-radius:12px;padding:8px 10px}
.id div{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;border-top:.5px solid var(--ln)}
.id span{color:var(--mu);font-size:10px}
.bk{border-radius:14px;padding:10px 14px;margin-top:8px}
.bt{padding:10px;border-radius:14px;color:#fff;font-weight:600;font-size:14px}
.tr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:.5px solid var(--ln)}
.tr:last-child{border:0}
.tr>div:first-child{flex:1}
.tg{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b2a3a;color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;z-index:30;display:none}
.tab{display:flex;border-bottom:.5px solid #d9d2c3;margin-bottom:8px}
.tab button{flex:1;padding:9px 0;background:none;color:var(--mu);font-weight:600}
.tab .on{color:var(--tx);border-bottom:3px solid var(--rd)}
.tab .on.i{border-color:var(--gr)}
</style>
</head>

let S;try{S=JSON.parse(localStorage.mkd)}catch(e){}S=S||seed();

function save(){localStorage.mkd=JSON.stringify(S);if(db&&user)db.collection('users').doc(user.uid).set({data:JSON.stringify(S),t:Date.now()}).catch(()=>{})}
function toast(m){const t=$('#tg');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
const cats=k=>S.cats[k],cat=(k,id)=>cats(k).find(c=>c.id===id);
const sum=f=>S.tx.filter(f).reduce((a,t)=>a+t.a,0);
const bal=(k,id)=>sum(t=>t.k===k&&t.c===id&&t.m==='baki')-sum(t=>t.k===k&&t.c===id&&(t.m==='pay'||t.m==='ret'));
const real=t=>t.m==='cash'||t.m==='baki';
const today=ymd(new Date());
function inRange(t,d0,d1){return t.d>=d0&&t.d<=d1}
function monthKey(){return today.slice(0,7)}

function graph(){
  const now=new Date(new Date().setHours(0,0,0,0)),B=Array.from({length:8},()=>({i:0,e:0}));
  S.tx.filter(real).forEach(t=>{const di=Math.floor((now-new Date(t.d+'T00:00:00'))/864e5);if(di<0||di>39)return;const b=7-Math.floor(di/5);B[b][t.k==='inc'?'i':'e']+=t.a});

function topCat(k){const m={};S.tx.filter(t=>t.k===k&&real(t)).forEach(t=>m[t.c]=(m[t.c]||0)+t.a);const e=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];return e?[cat(k,e[0]).n,e[1]]:['—',0]}

function catPage(){
  const k=V.k,c=cat(k,V.id),bl=bal(k,c.id),T=S.tx.filter(t=>t.k===k&&t.c===c.id).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id),

function sheet(){const k=SH.k,ex=k==='exp';
  $('#shi').innerHTML=`<h2>${ex?'ব্যয়':'আয়'} যোগ করো</h2><div class="sm" style="margin:-4px 0 8px">আজ · ${bn(today.slice(8))}/${bn(today.slice(5,7))}</div>
  <input class="big ${ex?'':'in'}" id="am" type="number" inputmode="decimal" placeholder="৳ 0" value="${SH.a||''}">
  <input class="inp" id="nt" placeholder="নোট: কী ${ex?'কিনলে':'হলো'}, কত টাকায়" value="${SH.n||''}">
  <div class="chips"><button data-m="cash" class="${SH.m==='cash'?'on':''}">নগদ</button><button data-m="baki" class="${SH.m==='baki'?'on':''}">বাকি</button></div>
  <h2 style="margin-top:12px;font-size:14px">ক্যাটাগরি</h2><div class="cg">${cats(k).map(c=>`<div data-c="${c.id}" class="${SH.cat===c.id?'sel':''}"><div class="ic" style="background:${c.c}">${c.e}</div>${c.n}</div>`).join('')}<div data-new><div class="ic" style="border:2px solid #5f5a50;color:#5f5a50;background:none">＋</div>নতুন</div></div>
  <button class="save ${ex?'':'in'}" id="sv">সেভ করো</button>`;$('#sh').classList.add('on')}
function openAdd(k,c){SH={k,cat:c||cats(k)[0].id,m:'cash'};sheet()}
function keep(){SH.a=$('#am').value;SH.n=$('#nt').value}

function drawer(){const I=[['আয়','⊕','hist|inc'],['ব্যয়','⊖','hist|exp'],['ক্যাটাগরি','▦','cats'],['Freeze হিসাব','🔒'],['To do list','☑'],['মাসিক বাজার লিস্ট','🛍'],['শিক্ষা','📖'],['সেটিং','⚙']];
  $('#dri').innerHTML=`<div class="dh"><div class="av">${user?user.displayName[0]:'MK'}</div><div><b>${user?user.displayName:'MK'}</b><div style="font-size:12px;opacity:.9">দৈনিক হিসাব</div></div></div>
  ${I.map(i=>`<button class="mi" data-mi="${i[2]||''}"><span>${i[1]}</span>${i[0]}</button>`).join('')}
  <button class="mi" data-out style="color:#dc2626;margin-top:12px"><span>⎋</span>লগ আউট</button>
  <div class="ft">Apps create by IMRAN HOSSAIN<br>new.mobicare.khulna@gmail.com</div>`;$('#dr').classList.add('on')}

document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-add],[data-m],[data-c],[data-new],[data-edit],[data-settle],[data-addcat],[data-del],[data-open],[data-open2],[data-newcat],[data-mi],[data-out],#sv,#mn,#lg,.ov');if(!t)return;
  const D=t.dataset;
  if(t.id==='mn')return drawer();
  if(t.id==='lg')return login();
  if(t.classList.contains('ov')){if(e.target===t)t.classList.remove('on');return}
  if('go'in D){$('#sh').classList.remove('on');return go(D.go)}
  if('add'in D)return openAdd(D.add);
  if('m'in D){keep();SH.m=D.m;return sheet()}
  if('c'in D){keep();SH.cat=D.c;return sheet()}
  if('new'in D||'newcat'in D){const k=D.newcat||SH.k,n=prompt('ক্যাটাগরির নাম'),em=n&&prompt('একটা ইমোজি দাও (যেমন 🍎)','🏷️');if(!n)return;if(D.newcat===undefined)keep();const id=k[0]+Date.now();cats(k).push({id,n,e:em||'🏷️',c:['#f97316','#3b82f6','#16a34a','#8b5cf6','#0ea5b7','#e11d48'][cats(k).length%6]});if(D.newcat===undefined)SH.cat=id;save();return D.newcat===undefined?sheet():render()}
  if(t.id==='sv'){keep();const a=parseFloat(SH.a);if(!(a>0))return toast('টাকার অঙ্ক লেখো');S.tx.push({id:Date.now(),k:SH.k,c:SH.cat,a,n:(SH.n||'').trim(),m:SH.m,d:today});save();$('#sh').classList.remove('on');render();return toast('সেভ হয়েছে')}
  if('edit'in D){const c=cat(V.k,V.id),n=prompt('নাম',c.pn||''),a=n!==null&&prompt('ঠিকানা',c.pa||''),ph=a!==false&&a!==null&&prompt('ফোন নম্বর',c.pp||'');if(ph===null||ph===false||a===null)return;Object.assign(c,{pn:n,pa:a,pp:ph});save();return render()}
  if('settle'in D){const ex=V.k==='exp',a=parseFloat(prompt(ex?'কত টাকা পরিশোধ করলে?':'কত টাকা ফেরত পেলে?'));if(!(a>0))return;const b=bal(V.k,V.id);if(a>b&&!confirm('বাকির চেয়ে বেশি লিখলে। তবুও সেভ করবে?'))return;S.tx.push({id:Date.now(),k:V.k,c:V.id,a,n:'',m:ex?'pay':'ret',d:today});save();return render()}
  if('addcat'in D)return openAdd(V.k,V.id);
  if('del'in D){if(confirm('এই লেনদেন মুছে ফেলবে?')){S.tx=S.tx.filter(x=>x.id!=D.del);save();render()}return}
  if('open'in D)return go('cat',{k:V.k,id:D.open});
  if('open2'in D){const[k,id]=D.open2.split('|');$('#dr').classList.remove('on');return go('cat',{k,id})}
  if('mi'in D){$('#dr').classList.remove('on');if(!D.mi)return toast('এই পেজ পরের ধাপে আসছে');const[a,b]=D.mi.split('|');return a==='hist'?go('hist',{k:b}):go('cats')}
  if('out'in D){$('#dr').classList.remove('on');if(user&&firebase.auth)firebase.auth().signOut();else toast('লগইন করা নেই')}
});

function login(){if(user)return toast(user.displayName+' · লগইন করা আছে');if(!FB.apiKey)return toast('firebaseConfig বসাওনি');firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{toast('লগইন হয়নি: '+(e.code||e.message));alert('লগইন ত্রুটি: '+(e.code||e.message))})}
try{if(FB.apiKey){firebase.initializeApp(FB);db=firebase.firestore();firebase.auth().onAuthStateChanged(async u=>{user=u;$('#lg').textContent=u?u.displayName.split(' ')[0]:'লগইন';if(u){try{const d=await db.collection('users').doc(u.uid).get();if(d.exists){S=JSON.parse(d.data().data)}else save();localStorage.mkd=JSON.stringify(S)}catch(e){}}render()})}}catch(e){}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();

})();
</script>
</body>
</html>
