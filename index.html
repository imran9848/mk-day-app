<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>এম কে ক্যাশ ম্যানেজার</title>
<style>
*{box-sizing:border-box;margin:0;font-family:"Noto Sans Bengali",system-ui,sans-serif}
body{background:#dfe7ef}
#app{height:100dvh;max-width:480px;margin:auto;background:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden}
.hd{padding:10px 12px;color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:600;gap:6px}
.bd{flex:1;overflow:auto;padding:10px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:6px 24px;border-top:1px solid #ddd}
.ci{width:36px;height:36px;border-radius:50%;border:1px solid #bbb;background:#fff;font-size:17px}
.hm{background:#1a5fd0;color:#fff;border:0}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.k{color:#fff;border-radius:8px;padding:6px 2px;text-align:center;font-size:11px}.k b{display:block;font-size:13px}
.r{background:#B71C1C}.g{background:#1B5E20}
.mc{border:1px solid #ddd;border-radius:12px;padding:14px 4px;text-align:center;font-size:13px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #eee;font-size:14px}
.btn{border:0;border-radius:12px;padding:11px;font-size:14px;font-weight:600;color:#fff;width:100%}
.add{border:1px dashed #888;border-radius:8px;padding:9px;text-align:center;color:#185FA5;margin-bottom:8px;font-size:14px}
input{width:100%;padding:9px;border:1px solid #aaa;border-radius:8px;font-size:15px;margin:4px 0}
.fab{position:absolute;right:21px;bottom:58px;width:48px;height:48px;border-radius:50%;background:#1a9e4b;color:#fff;font-size:26px;border:0}
.kb{border:3px solid #F2B705;border-radius:12px;padding:12px 0;font-size:18px;font-weight:600;background:#fff;text-align:center}
.tab{flex:1;text-align:center;padding:8px;border-bottom:2px solid #ddd}.tab.on{border-color:#1a9e4b;font-weight:600}
</style></head><body><div id="app"></div>
<script>
let D=JSON.parse(localStorage.mkcm||'null')||{tx:[],p:[],todo:[],pw:'',side:'r'};
const save=()=>localStorage.mkcm=JSON.stringify(D),
bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]),tk=n=>'৳'+bn(Math.round(n)),
dt=x=>new Date(x).toLocaleDateString('bn-BD',{day:'numeric',month:'long'}),
bal=p=>p.t.filter(x=>!x.f).reduce((s,x)=>s+(x.k=='a'?x.m:-x.m),0),
sum=f=>D.tx.filter(f).reduce((s,x)=>s+x.m,0),
pb=k=>D.p.filter(p=>p.k==k&&!p.f).reduce((s,p)=>s+bal(p),0),
EC={'বাজার':['মুদি দোকান','মাংস','কাঁচা বাজার','মাছ'],'চিকিৎসা':['ঔষধ','ডাক্তারের খরচ','টেস্ট'],'দৈনিক পকেট খরচ':['চা সিগারেট','যাতায়াত','বন্ধুদের পিছনে খরচ','নাস্তা'],'ব্যবসা':['মাল ক্রয়','কর্মচারীর বেতন','অন্যান্য খরচ'],'বাসা ও দোকান ভাড়া':['বাসা ভাড়া','দোকান ভাড়া'],'বিদ্যুৎ ও ইন্টারনেট বিল':['বিদ্যুৎ খরচ','ইন্টারনেট বিল','ডিশ বিল','গ্যাস বিল'],'বাচ্চার খরচ':['খাবার','খেলনা','পড়াশোনার খরচ','জামাকাপড়'],'মোবাইল খরচ':['মোবাইল রিচার্জ','মোবাইলের অ্যাক্সেসরিজ','মোবাইল মেরামত'],'যাতায়াত খরচ':['বাস/সিএনজি ভাড়া','রিকশা ভাড়া','পেট্রল/অকটেন'],'শপিং অ্যান্ড বিউটি':['পোশাক','মহিলাদের বিউটি','জুতা ও ব্যাগ','প্রসাধনী'],'অনলাইন':['অনলাইন কেনাকাটা','ডেলিভারি চার্জ','অ্যাপ সাবস্ক্রিপশন'],'পড়াশোনা':['টিউশন ফি','বই-খাতা','কোচিং ফি']},
IC={'চাকরি':['চাকরি ১','চাকরি ২','চাকরি ৩'],'ব্যবসা':['দোকান','পাইকারি ব্যবসা','ফেরি / ভ্রাম্যমাণ বিক্রি'],'ভাড়া':['বাসা','দোকান','গাড়ি'],'কৃষি ও পশুপালন':['ফসল','মাছ','হাঁস-মুরগি','সবজি'],'অনলাইন আয়':['ফ্রিল্যান্সিং','অনলাইন বিক্রি','ইউটিউব','ফেসবুক','শেয়ার বাজার'],'দক্ষতা ও সার্ভিস':['সার্ভিস','মোবাইল সার্ভিসিং','মেরামত ও মিস্ত্রি'],'অন্যান্য প্রাপ্তি':['রেমিট্যান্স','উপহার']},
CARDS=[['নগদ ক্রয়',x=>x.t=='e'&&!x.cr],['বাকি ক্রয়',x=>x.t=='e'&&x.cr],['ধার/লোন','B'],['মোট খরচ',x=>x.t=='e'],['নগদ আয়',x=>x.t=='i'&&!x.cr],['বাকি আছে',x=>x.t=='i'&&x.cr],['ধার/বাকি','L'],['মোট আয়',x=>x.t=='i']];
let S=[['home']],sel={},tab=0,ce='',pw=()=>{if(!D.pw){let a=prompt('ফ্রিজের নতুন পাসওয়ার্ড দাও');if(!a)return 0;D.pw=a;save();return 1}return prompt('ফ্রিজের পাসওয়ার্ড দাও')==D.pw};
const go=(...a)=>{S.push(a);R()},back=()=>{S.length>1&&S.pop();R()},home=()=>{S=[['home']];sel={};R()};
const bar=()=>`<div class="bar" style="flex-direction:${D.side=='r'?'row':'row-reverse'}"><span style="width:36px"></span><button class="ci hm" onclick="home()">🏠</button><button class="ci" onclick="back()">←</button></div>`;
const tpm=t=>{const o={};D.tx.filter(x=>x.t==t).forEach(x=>o[x.s]=(o[x.s]||0)+x.m);const k=Object.keys(o).sort((a,b)=>o[b]-o[a])[0];return k?k+' '+tk(o[k]):'—'};
const P={
home(){const n=Date.now(),B=Array.from({length:6},(_,i)=>{const a=n-(6-i)*5*864e5,b=a+5*864e5,f=t=>D.tx.filter(x=>x.t==t&&x.d>=a&&x.d<b).reduce((s,x)=>s+x.m,0);return[f('i'),f('e')]}),mx=Math.max(1,...B.flat()),
c=CARDS.map(([t,f],i)=>`<div class="k ${i<4?'r':'g'}" onclick="${typeof f=='string'?`go('pl','${f}')`:`go('ls',${i})`}">${t}<b>${tk(typeof f=='string'?pb(f):sum(f))}</b></div>`);
return`<div class="hd" style="background:#185FA5"><span style="font-size:9px;max-width:70px">এম কে ক্যাশ ম্যানেজার</span><span style="border:1px solid #fff9;border-radius:8px;padding:2px 10px;text-align:center"><div id="dt" style="font-size:9px;color:#FFE082"></div><div id="tm" style="font-size:16px;color:#FF8A80"></div></span><span onclick="go('mn')" style="font-size:22px">☰</span></div>
<div style="flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:8px;overflow:hidden"><div><div class="g4">${c.slice(0,4).join('')}</div></div>
<div class="g4" style="margin:0">${CARDS.slice(4).map(([t,f],i)=>`<div class="k g" onclick="${typeof f=='string'?`go('pl','${f}')`:`go('ls',${i+4})`}">${t}<b>${tk(typeof f=='string'?pb(f):sum(f))}</b></div>`).join('')}</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px"><div style="background:#fbe9c0;border-radius:8px;padding:6px">সবথেকে বেশি আয়<br><b>${tpm('i')}</b></div><div style="background:#fbdcdc;border-radius:8px;padding:6px">সবথেকে বেশি ব্যয়<br><b>${tpm('e')}</b></div></div>
<div style="border:1px solid #ddd;border-radius:8px;padding:6px"><small>আয়-ব্যয় গ্রাফ (শেষ ৩০ দিন)</small><div style="display:flex;gap:6px;height:48px;align-items:flex-end">${B.map(([i,e])=>`<div style="flex:1;display:flex;gap:2px;align-items:flex-end;height:100%"><div style="flex:1;background:#639922;height:${i/mx*100}%"></div><div style="flex:1;background:#E24B4A;height:${e/mx*100}%"></div></div>`).join('')}</div></div>
<div style="background:#e3eefb;border-radius:8px;padding:6px;font-size:11px;color:#185FA5"><b>আজকের motivation</b><br>১. ধৈর্য আর সঞ্চয়ই দীর্ঘমেয়াদে বড় করে।<br>২. ছোট ছোট খরচই বড় ক্ষতি করে।<br>৩. আজকের হিসাব কালকের শান্তি।</div></div>
<div style="position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px 12px"><button class="btn" style="background:#1a9e4b" onclick="go('pl','L')">ধার/বাকি</button><button class="btn" style="background:#e8590c" onclick="go('pl','B')">ধার/লোন</button><button class="btn" style="background:#dcf8e5;color:#1a7a3c" onclick="sel={};go('add','i')">⊕ আয়</button><button class="btn" style="background:#fde2e2;color:#b42323" onclick="sel={};go('add','e')">⊖ ব্যয়</button><button class="hm" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;border:3px solid #fff;font-size:11px">🏠<br>হোম</button></div>`},
ls(i){const [t,f]=CARDS[i],a=Date.now()-30*864e5;return[t+' · শেষ ১ মাস',i<4?'#B71C1C':'#1B5E20',D.tx.filter(x=>f(x)&&x.d>a).sort((a,b)=>b.d-a.d).map(x=>`<div class="row"><span>${x.s}<br><small>${dt(x.d)} · ${x.n||''}</small></span><b>${tk(x.m)}</b></div>`).join('')||'<p>কোনো হিসাব নেই</p>']},
add(t){const C=t=='e'?EC:IC,col=t=='e'?'#B71C1C':'#1B5E20',h=t=='e'?'ব্যয়':'আয়';let b;
if(!sel.m)b=`<div class="gr">${Object.keys(C).map(k=>`<div class="mc" onclick="sel.m='${k}';R()">${k}</div>`).join('')}</div>`;
else if(!sel.s)b=C[sel.m].map((s,i)=>`<div class="row" onclick="sel.s='${s}';R()">${bn(i+1)}. ${s}<span>›</span></div>`).join('');
else b=`<p style="text-align:center;color:${col}"><b>${sel.m} › ${sel.s}</b></p><input id="am" type="number" inputmode="numeric" placeholder="টাকার পরিমাণ"><input id="nt" placeholder="নোট"><label><input id="cr" type="checkbox" style="width:auto"> বাকি</label><button class="btn" style="background:${col};margin-top:10px" onclick="svTx('${t}')">${h} সংরক্ষণ করো</button>`;
return[h,col,b]},
pl(k){const L=D.p.filter(p=>p.k==k&&!p.f),s=ty=>L.filter(p=>p.ty==ty).reduce((a,p)=>a+bal(p),0),col=k=='L'?'#1B5E20':'#B71C1C',c=k=='L'?'g':'r';
return[k=='L'?'ধার/বাকি · আমি পাবো':'ধার/লোন · আমি দিবো',col,`<div class="g3"><div class="k ${c}">ব্যক্তি<b>${tk(s('ব্যক্তি'))}</b></div><div class="k ${c}">প্রতিষ্ঠান<b>${tk(s('প্রতিষ্ঠান'))}</b></div><div class="k ${c}">${k=='L'?'মোট পাবো':'মোট দিবো'}<b>${tk(pb(k))}</b></div></div><div class="add" onclick="addP('${k}')">+ ব্যক্তি/প্রতিষ্ঠান যোগ করো</div>`+L.map(p=>`<div class="row" onclick="go('pp',${p.id})"><span><b>${p.n}</b><br><small>${p.ph} · ${p.ad}</small></span><b>${tk(bal(p))}</b></div>`).join('')]},
pp(id){const p=D.p.find(x=>x.id==id),col=p.k=='L'?'#1B5E20':'#B71C1C',o=bal(p)<=0,A=[],Z=[];
p.t.forEach((x,i)=>{if(x.f)return;const cut=x.k=='a'&&(o||(x.pd||0)>=x.m),h=`<div class="row" style="${cut?'text-decoration:line-through;opacity:.5':''}"><span>${x.k=='a'?'ধার':'পরিশোধ'}<br><small>${dt(x.d)} · ${x.n||''}</small></span><span><b>${x.k=='a'?'+':'−'}${tk(x.m)}</b> ${x.k=='a'&&!cut?`<span onclick="er(${id},${i})">💵</span>`:''} <span onclick="fe(${id},${i})">🔒</span></span></div>`;(cut||x.k=='p'?Z:A).push(h)});
return[p.n,col,`<div class="row"><small>${p.ph} · ${p.ad}</small><span class="k ${p.k=='L'?'g':'r'}" style="padding:6px 14px">এখনো বাকি<b>${tk(bal(p))}</b></span></div><div style="display:flex;gap:8px;margin:10px 0"><button class="btn" style="background:#555" onclick="tr(${id},'a')">+ লেনদেন</button><button class="btn" style="background:${col}" onclick="tr(${id},'p')">${p.k=='L'?'ফেরত পেলাম':'পরিশোধ'}</button></div>${A.reverse().join('')}${Z.length?'<p style="margin-top:10px"><b>পরিশোধ</b></p>'+Z.reverse().join(''):''}`,`<span onclick="frz(${id})" style="font-size:20px">🔒</span>`]},
lk(){const R1=[];D.p.forEach(p=>{if(p.f)R1.push(`<div class="row"><span>🔒 <b>${p.n}</b> (পুরো ব্যক্তি)<br><small>${p.ph} · ${p.ad}</small></span><span><b>${tk(p.t.reduce((s,x)=>s+(x.k=='a'?x.m:-x.m),0))}</b> <small onclick="uf(${p.id})" style="color:#185FA5">🔓 বের করো</small></span></div>`);else p.t.forEach((x,i)=>{if(x.f)R1.push(`<div class="row"><span>🔒 <b>${p.n}</b> · ${x.k=='a'?'ধার':'পরিশোধ'}<br><small>${p.ph} · ${p.ad} · ${dt(x.d)}</small></span><span><b>${tk(x.m)}</b> <small onclick="uf(${p.id},${i})" style="color:#185FA5">🔓 বের করো</small></span></div>`)})});
return['হিসাব লকার 🔒','#0f8a9d','<div style="background:#e3eefb;color:#185FA5;border-radius:8px;padding:8px;margin-bottom:8px;font-size:13px">🔒 হিসাব ফ্রিজের ভিতরে আছে</div>'+(R1.join('')||'<p>লকার খালি</p>')]},
td(){const L=D.todo.map((x,i)=>[x,i]).filter(([x])=>!!x.dn==!!tab);return['এখন মনে থাকবে','#185FA5',`<div style="display:flex"><div class="tab ${tab?'':'on'}" onclick="tab=0;R()">করা হয়নি (${bn(D.todo.filter(x=>!x.dn).length)})</div><div class="tab ${tab?'on':''}" onclick="tab=1;R()">হয়ে গেছে (${bn(D.todo.filter(x=>x.dn).length)})</div></div>`+L.map(([x,i])=>`<div class="row"><span onclick="tg(${i})"><input type="checkbox" style="width:auto" ${x.dn?'checked':''}> ${x.x}</span><span onclick="D.todo.splice(${i},1);save();R()">🗑</span></div>`).join('')+'<button class="fab" onclick="at()">+</button>']},
